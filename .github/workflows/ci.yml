name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (in-memory DEMO database)
        run: |
          DEMO_MODE=true npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/health && break; sleep 2; done
          npm run test:e2e
  postgres:
    # real PostgreSQL 16: migrations 001–006, RLS, permissions, concurrency, worker processes (synthetic data only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gov_test
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: gov_test
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U gov_test -d gov_test" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://gov_test:test-only-local@127.0.0.1:55433/gov_test
