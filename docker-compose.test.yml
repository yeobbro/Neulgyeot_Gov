# Throw-away PostgreSQL 16 for integration tests ONLY (synthetic data, tmpfs storage, bound to 127.0.0.1).
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://gov_test:test-only-local@127.0.0.1:55433/gov_test npm run test:pg
#   docker compose -f docker-compose.test.yml down
# The password below is a local test credential, not a secret. Never reuse it, and never point TEST_DATABASE_URL
# at a shared, staging or production database (the test helper refuses non-local hosts).
services:
  postgres-test:
    image: ${POSTGRES_TEST_IMAGE:-postgres:16-alpine} # Docker Hub rate-limited? use public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: gov_test
      POSTGRES_PASSWORD: test-only-local
      POSTGRES_DB: gov_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gov_test -d gov_test"]
      interval: 2s
      timeout: 3s
      retries: 30
